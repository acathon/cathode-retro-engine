<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cathode Editor</title>
  <style>
    :root {
      --bg-primary: #0d0d0d;
      --bg-secondary: #1a1a1a;
      --bg-panel: #141414;
      --bg-input: #222;
      --accent: #7c3aff;
      --accent-hover: #9b5dff;
      --text-primary: #e0e0e0;
      --text-secondary: #888;
      --border: #2a2a2a;
      --danger: #ff4444;
      --success: #44ff88;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
