<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Engine — Block Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #12131a;
      --panel: #1b1d27;
      --line: #2c2f3d;
      --text: #d8dae6;
      --muted: #7b8096;
      --accent: #ffcc44;
      --green: #00e436;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.5 ui-monospace, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      flex: 0 0 auto;
    }

    header h1 { font-size: 14px; letter-spacing: 1px; color: var(--accent); }
    header .spacer { flex: 1; }

    button {
      font: inherit;
      background: #262a38;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 5px 12px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--green); color: #06210c; border-color: var(--green); font-weight: bold; }

    main { flex: 1; display: grid; grid-template-columns: 1fr 340px; min-height: 0; }

    #blockly { min-width: 0; }

    aside {
      border-left: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .pane-title {
      padding: 7px 12px;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      text-transform: uppercase;
    }

    #stage { padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }

    canvas {
      image-rendering: pixelated;
      border: 2px solid var(--line);
      background: #000;
      width: 288px;
      height: 270px;
    }

    #vars {
      font-size: 12px;
      color: var(--muted);
      min-height: 18px;
      align-self: stretch;
      padding: 0 2px;
    }
    #vars b { color: var(--accent); }

    #code {
      flex: 1;
      overflow: auto;
      margin: 0;
      padding: 10px 12px;
      font-size: 11px;
      line-height: 1.45;
      color: #a9b0c8;
      white-space: pre;
      background: #14161f;
      min-height: 0;
    }

    #status {
      padding: 6px 12px;
      font-size: 11px;
      border-top: 1px solid var(--line);
      color: var(--muted);
    }
  </style>
</head>

<body>
  <header>
    <h1>RETRO ENGINE · BLOCK EDITOR</h1>
    <button id="run" class="primary">▶ Run</button>
    <button id="stop">■ Stop</button>
    <button id="sample">Load sample</button>
    <span class="spacer"></span>
    <button id="copy">Copy TypeScript</button>
  </header>

  <main>
    <div id="blockly"></div>
    <aside>
      <div class="pane-title">Stage</div>
      <div id="stage">
        <canvas id="game"></canvas>
        <div id="vars"></div>
      </div>
      <div class="pane-title">Generated TypeScript</div>
      <pre id="code">// drag some blocks…</pre>
    </aside>
  </main>

  <div id="status">Ready.</div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
