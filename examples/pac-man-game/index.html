<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pac-Man — retor-engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      color: #ffdd00;
      gap: 12px;
    }

    #hud {
      display: flex;
      gap: 32px;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #game-wrapper {
      position: relative;
    }

    #game {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 8px #ff6622;
      pointer-events: none;
      letter-spacing: 0.1em;
    }

    #controls {
      display: flex;
      gap: 24px;
      font-size: 11px;
      color: #666;
      letter-spacing: 0.05em;
    }

    #controls span { color: #aaa; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="score">SCORE: 0</div>
    <div id="lives">LIVES: ❤ ❤ ❤</div>
    <div id="level">LEVEL: 1</div>
  </div>

  <div id="game-wrapper">
    <canvas id="game"></canvas>
    <div id="message">READY!</div>
  </div>

  <div id="controls">
    Move: <span>Arrow Keys / WASD</span>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
