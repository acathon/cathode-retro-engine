<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Space Invaders</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a14;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: monospace;
      color: #aaa;
    }

    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    canvas {
      display: block;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 14px;
      padding: 4px 0;
    }

    #hud span {
      color: #0f0;
    }

    #msg {
      font-size: 13px;
      color: #555;
      min-height: 18px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="game-container">
    <div id="hud">
      <div>SCORE: <span id="score">0</span></div>
      <div>WAVE: <span id="wave">1</span></div>
      <div>LIVES: <span id="lives">♥♥♥</span></div>
    </div>
    <canvas id="game"></canvas>
    <div id="msg">Arrow keys to move · Z to shoot · Enter to start</div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>

</html>
