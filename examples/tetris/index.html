<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TETRIS — Game Boy · Cathode</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #2b4029;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: monospace;
    }

    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    #game {
      display: block;
      border: 4px solid #1a2e18;
      border-radius: 4px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3), 0 4px 12px rgba(0, 0, 0, 0.5);
    }

    #info {
      font-size: 11px;
      color: #89a880;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="game-container">
    <div id="game-wrap" style="position:relative;display:inline-block;">
      <canvas id="game"></canvas>
    </div>
    <div id="info">← → Move · ↑ Rotate · ↓ Soft Drop · Z Hard Drop · Enter Start</div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>

</html>
