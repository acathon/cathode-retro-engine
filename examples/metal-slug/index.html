<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>METAL SLUG — Retro Engine</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: 'Courier New', monospace;
        color: #ddd;
        overflow: hidden;
      }
      #game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      canvas { display: block; }
      #hud {
        display: flex;
        justify-content: space-between;
        width: 100%;
        font-size: 13px;
        padding: 2px 4px;
      }
      #hud .score { color: #ff0; }
      #hud .lives { color: #f44; }
      #hud .ammo  { color: #4df; }
      #hud .wave  { color: #4f4; }
      #msg {
        font-size: 12px;
        color: #666;
        min-height: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="hud">
        <span class="score">SCORE: <b id="score">0</b></span>
        <span class="wave">STAGE <b id="stage">1</b></span>
        <span class="ammo">AMMO: <b id="ammo">∞</b></span>
        <span class="lives">LIVES: <b id="lives">♥♥♥</b></span>
      </div>
      <canvas id="game"></canvas>
      <div id="msg">← → Move · ↑ Jump · Z Shoot · X Grenade · Enter Start</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
