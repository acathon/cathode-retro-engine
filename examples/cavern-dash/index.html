<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAVERN DASH — NES · Retro Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0b0d1a;
      color: #c2c3c7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: monospace;
    }

    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    canvas {
      image-rendering: pixelated;
      border: 3px solid #29adff;
      border-radius: 3px;
      box-shadow: 0 0 28px rgba(41, 173, 255, 0.35);
      background: #000;
    }

    #hud {
      display: flex;
      gap: 28px;
      font-size: 15px;
      letter-spacing: 1px;
    }

    #hud b { color: #ffec27; }

    #status {
      min-height: 22px;
      font-size: 15px;
      letter-spacing: 1px;
      color: #00e436;
    }

    #keys {
      font-size: 12px;
      color: #5f574f;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <div id="game-container">
    <div id="hud">
      <span>GEMS <b id="gems">0</b>/<b id="gems-total">0</b></span>
      <span>DEATHS <b id="deaths">0</b></span>
      <span>BEST <b id="best">—</b></span>
    </div>
    <canvas id="game"></canvas>
    <div id="status">REACH THE BLUE PORTAL</div>
    <div id="keys">&larr; &rarr; MOVE &nbsp;·&nbsp; Z JUMP &nbsp;·&nbsp; ENTER RESTART</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
