<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIXEL PATIENCE — Klondike · Cathode</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1b14;
      color: #9fc4ac;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: monospace;
      padding: 16px;
    }

    #wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }

    #title {
      display: flex;
      align-items: baseline;
      gap: 14px;
      font-size: 18px;
      letter-spacing: 3px;
      color: #f7be39;
    }

    #title small { font-size: 11px; letter-spacing: 2px; color: #6d8f79; }

    canvas#game {
      image-rendering: pixelated;
      display: block;
      max-width: 100%;
      border: 3px solid #2c5a3e;
      border-radius: 4px;
      box-shadow: 0 0 34px rgba(40, 160, 90, 0.2);
      background: #16402c;
    }

    #status { font-size: 13px; letter-spacing: 1px; min-height: 18px; }

    #keys {
      font-size: 12px;
      color: #5f8a70;
      letter-spacing: 1px;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #keys b { color: #9fc4ac; font-weight: normal; }

    #credit {
      font-size: 11px;
      color: #4d7360;
      letter-spacing: 1px;
    }

    #credit b { color: #7ba98c; font-weight: normal; }

    #credit a { color: #7ba98c; }

  </style>
</head>

<body>
  <div id="wrap">
    <div id="title">PIXEL PATIENCE <small>WINS <span id="wins">0</span></small></div>
    <canvas id="game"></canvas>
    <div id="status">Loading…</div>
    <div id="keys">
      <span><b>&larr; &rarr;</b> pile</span>
      <span><b>&uarr; &darr;</b> take more / fewer</span>
      <span><b>Z</b> pick up · drop · deal</span>
      <span><b>X</b> send it somewhere</span>
      <span><b>Enter</b> new deal</span>
    </div>
    <div id="credit">
      Card art: <b>8-bit Playing Cards</b> by
      <a href="https://sdkfz181tiger.itch.io/assets-for-8bit-playing-card-games"
        target="_blank" rel="noopener">sdkfz181tiger</a> — free for personal and commercial use.
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>

</html>
