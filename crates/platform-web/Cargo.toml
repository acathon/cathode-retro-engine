[package]
name = "cathode-platform-web"
version = "0.1.0"
edition = "2021"
authors = ["Cathode Contributors"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cathode-core = { path = "../core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"
hecs = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "HtmlCanvasElement", "CanvasRenderingContext2d",
  "ImageData", "AudioContext", "AudioBufferSourceNode", "ScriptProcessorNode",
  "AudioProcessingEvent", "KeyboardEvent", "EventTarget", "Performance",
  "console", "TouchEvent", "Touch", "TouchList"
]

# wasm-pack runs wasm-opt after wasm-bindgen and writes package.json only once
# that succeeds. It downloads binaryen from GitHub on first use, so on any
# machine without that network access the build dies mid-way: the .js and
# .wasm land, but no package.json, and the package becomes unresolvable by
# name. Every example then needs a hand-written vite alias to a raw file path.
# Turning it off makes the build complete identically everywhere.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
