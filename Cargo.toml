[workspace]
resolver = "2"
members = ["crates/core", "crates/platform-web", "crates/platform-native"]
# The Tauri desktop editor is its own workspace. It pulls in GTK/WebKit system
# libraries that the engine itself never needs, and keeping it here meant
# `cargo test --workspace` failed on any machine without a desktop GUI
# toolchain installed. Build it from packages/editor-desktop instead.
exclude = ["packages/editor-desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Cathode Contributors"]
description = "A modern game engine with the look and feel of NES / Game Boy / NeoGeo games."
repository = "https://github.com/acathon/retor-engine"
license = "MIT"

[workspace.dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
glam = { version = "0.27", features = ["serde"] }
hecs = "0.10"
