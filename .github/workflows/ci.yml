name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
          
      # cathode-platform-native links against ALSA (cpal) and libudev (gamepad
      # enumeration). The Tauri desktop editor is a separate workspace, so its
      # GTK/WebKit dependencies are deliberately not needed here.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libdbus-1-dev pkg-config

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        
      - name: Check Formatting
        run: cargo fmt --all -- --check
        
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
        
      - name: Check Workspace
        run: cargo check --workspace
        
      - name: Check WASM
        run: cargo check -p cathode-platform-web --target wasm32-unknown-unknown
        
      - name: Run Tests
        run: cargo test --workspace

  # `packages/sdk/wasm` is a build artifact that is checked in on purpose, so a
  # clone runs without a Rust toolchain. This rebuilds it and fails if the
  # committed bindings no longer match the Rust source -- the one way a
  # committed artifact can go quietly wrong.
  wasm:
    name: Committed WASM Is Current
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compare the committed build against the Rust source
        run: node scripts/check-wasm-current.mjs

  # Deliberately independent of the `wasm` job: this is the contributor who has
  # only Node installed, building from a plain clone with the committed engine.
  typescript:
    name: TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # CI only ever installs on Linux, so a lockfile that lost its Windows and
      # macOS binaries installs fine here and fails on a contributor's machine.
      # Checked before npm ci, so the report names the cause rather than a
      # missing module several steps later.
      - name: Lockfile works on every platform
        run: node scripts/check-lockfile-portable.mjs

      - name: Install dependencies
        run: npm ci
        
      - name: Build SDK
        run: npm run build:sdk
        
      - name: Build CLI
        run: npm run build:cli

      # Runs the block-language unit tests. --if-present skips the workspaces
      # that define no test script.
      - name: Run TypeScript tests
        run: npm test

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [wasm, typescript]
    steps:
      - run: echo "Placeholder for release job"
