name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
          
      # retro-platform-native links against ALSA (cpal) and libudev (gamepad
      # enumeration). The Tauri desktop editor is a separate workspace, so its
      # GTK/WebKit dependencies are deliberately not needed here.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libdbus-1-dev pkg-config

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        
      - name: Check Formatting
        run: cargo fmt --all -- --check
        
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
        
      - name: Check Workspace
        run: cargo check --workspace
        
      - name: Check WASM
        run: cargo check -p retro-platform-web --target wasm32-unknown-unknown
        
      - name: Run Tests
        run: cargo test --workspace

  wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
        
      - name: Build WASM
        run: wasm-pack build crates/platform-web --out-dir ../../packages/sdk/wasm --target web
        
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-wasm
          path: packages/sdk/wasm/

  typescript:
    name: TypeScript Build
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-wasm
          path: packages/sdk/wasm/
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build SDK
        run: npm run build:sdk
        
      - name: Build CLI
        run: npm run build:cli

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: typescript
    steps:
      - run: echo "Placeholder for release job"
