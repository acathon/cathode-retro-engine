name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Renders docs/*.md into site/docs/, builds every example under
      # site/dist/games/<name>/, and rewrites the gallery links to match.
      # Games are built with a relative base, so the result works unchanged
      # at a user site, a project site, or any subdirectory.
      #
      # No Rust step: the web engine is committed at packages/sdk/wasm, the
      # same build a contributor gets from a plain clone. Publishing exactly
      # what everyone else runs is the point.
      - name: Build the site
        run: npm run build:dist

      - name: Check the site is not missing its games
        run: |
          count=$(find site/dist/games -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "$count games built"
          test "$count" -ge 16
          test -f site/dist/index.html
          test -f site/dist/games.html
          test -f site/dist/docs.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
